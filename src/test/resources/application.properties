spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:reform-test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=never
spring.batch.job.enabled=false
spring.batch.jdbc.initialize-schema=never
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.servlet.multipart.location=./build/test-uploads
security.jwt.secret=test-jwt-secret-for-unit-tests-only
security.jwt.access-token-expiration-seconds=3600
security.jwt.refresh-token-expiration-seconds=1209600
app.auth.oauth-success-redirect-uri=http://localhost:5173/oauth/callback
app.auth.oauth-failure-redirect-uri=http://localhost:5173/login?error=oauth
account.verification.type=mock
toss.secret-key=test-toss-secret
toss.client-key=test-toss-client
app.ai.vector.enabled=false
spring.ai.openai.api-key=test-openai-key
# 메일 발송 빈(JavaMailSender)은 호스트가 있어야 만들어진다 - 테스트는 실제로 보내지 않는다
spring.mail.host=localhost
app.mail.enabled=false
app.mail.from=test@example.com
# 소셜 로그인 빈(ClientRegistrationRepository)은 등록 정보가 있어야 만들어진다 - 테스트용 가짜 값
spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.user-name-attribute=id
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.registration.kakao.client-name=kakao
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.redirect-uri=http://localhost:5173/login/oauth2/code/kakao
spring.security.oauth2.client.registration.kakao.client-id=test-kakao-client
spring.security.oauth2.client.registration.kakao.client-secret=test-kakao-secret
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.kakao.scope=profile_nickname,account_email
spring.security.oauth2.client.registration.google.client-id=test-google-client
spring.security.oauth2.client.registration.google.client-secret=test-google-secret
spring.security.oauth2.client.registration.google.scope=email,profile
