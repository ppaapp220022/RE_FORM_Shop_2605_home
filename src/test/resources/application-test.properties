# 테스트 프로필 - main의 application.properties 위에 덮어쓰는 값만 둔다 (config/application.properties가 켠다)
#  - 외부 서비스(MariaDB·Redis 장애 대비·OpenAI·결제·소셜 로그인·메일)는 테스트용 값이나 끄는 값으로 바꾼다
#  - main에서 기본값 없이 환경 변수로 받는 값은 여기서 채워야 CI(.env 없음)에서도 컨텍스트가 뜬다

# H2 (MariaDB 대신)
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:reform-test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=never
spring.batch.jdbc.initialize-schema=never

# SQL 로그는 테스트 출력만 늘리므로 끈다
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
mybatis.configuration.log-impl=org.apache.ibatis.logging.nologging.NoLoggingImpl
logging.level.org.mybatis=info
logging.level.java.sql=info

spring.servlet.multipart.location=./build/test-uploads

# 의미 검색 벡터 저장소(PG)는 띄우지 않는다
app.ai.vector.enabled=false
spring.ai.openai.api-key=test-openai-key

security.jwt.secret=test-jwt-secret-for-unit-tests-only
toss.secret-key=test-toss-secret
toss.client-key=test-toss-client
delivery-api.api-key=test-delivery-key
delivery-api.secret-key=test-delivery-secret

# 메일 발송 빈(JavaMailSender)은 호스트가 있어야 만들어진다 - 테스트는 실제로 보내지 않는다
spring.mail.host=localhost
spring.mail.password=test-mail-password
app.mail.enabled=false

# 소셜 로그인 빈(ClientRegistrationRepository)은 등록 정보가 있어야 만들어진다 - 테스트용 가짜 값
spring.security.oauth2.client.registration.kakao.client-id=test-kakao-client
spring.security.oauth2.client.registration.kakao.client-secret=test-kakao-secret
spring.security.oauth2.client.registration.google.client-id=test-google-client
spring.security.oauth2.client.registration.google.client-secret=test-google-secret
