# 테스트는 test 프로필로 실행한다 (값은 application-test.properties)
#  - 테스트 리소스에 application.properties를 두면 같은 경로인 main의 application.properties를 가려
#    운영 설정(Redis 타임아웃 등)이 테스트에서 통째로 빠졌다. config/ 아래는 main 파일과 함께 읽힌다
#  - 빌드 도구(gradle)를 거치지 않고 IDE에서 테스트 하나만 실행해도 적용된다
#  - active가 아니라 include로 켜, 어떤 테스트가 다른 프로필을 지정해도 test 프로필이 빠지지 않는다
spring.profiles.include=test
