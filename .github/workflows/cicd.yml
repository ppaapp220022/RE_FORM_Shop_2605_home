name: Deploy Backend To Home Server

on:
  push:
    branches: [ main ]

# 연달아 머지하면 배포가 동시에 돌아, 먼저 시작한 배포가 나중에 끝나면 운영이 예전 버전으로 덮인다.
# 실행 중인 배포는 끝까지 두고(컨테이너 교체 중 중단 방지), 대기 중인 것은 가장 최신 것만 남긴다.
concurrency:
  group: deploy-home-server
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/reform-shop-home

jobs:
  build-and-push:
    runs-on: ubuntu-22.04

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'corretto'
          # Gradle 배포판·의존성을 캐시해 services.gradle.org 다운로드 타임아웃으로 배포가 실패하지 않게 한다
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compile backend
        run: ./gradlew compileJava --no-daemon

      # cache-to: type=gha는 기본 docker 드라이버에서 지원되지 않아 buildx 빌더를 따로 만든다
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          build-args: |
            APP_VERSION=${{ github.sha }}
          # Gradle 배포판 레이어를 다음 배포에서 다시 쓴다 (gradle 파일이 바뀔 때만 새로 내려받음)
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: [self-hosted, Linux, X64, reform-home]

    permissions:
      contents: read
      packages: read

    env:
      DEPLOY_PATH: /srv/docker/reform

    steps:
      - uses: actions/checkout@v6

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Sync compose files
        run: |
          mkdir -p "$DEPLOY_PATH"
          cp deployment/home-server/docker-compose.yml "$DEPLOY_PATH/docker-compose.yml"
          if [ ! -f "$DEPLOY_PATH/.env" ]; then
            cp deployment/home-server/.env.example "$DEPLOY_PATH/.env"
          fi

      - name: Deploy backend and infra
        env:
          # 방금 build-and-push가 올린 이미지를 그대로 쓴다. 셸 환경변수가 .env보다 우선하므로
          # 서버 .env의 BACKEND_IMAGE가 옛 주소(예: 계정 이름 변경 전)여도 영향받지 않는다.
          BACKEND_IMAGE: ${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          cd "$DEPLOY_PATH"
          docker compose --env-file .env pull mariadb redis pgvector backend
          docker compose --env-file .env up -d mariadb redis pgvector backend