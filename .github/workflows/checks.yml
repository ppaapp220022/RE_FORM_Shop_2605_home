# 결정적 검사. main ruleset의 필수 체크 `checks`다.
# 컴파일 + 로컬 모더레이션 eval(API 호출 없음)을 돌리고, 기준치 미달이면 실패한다.
# OpenAI 실호출 eval은 비용이 들어 workflow_dispatch(live=true)로만 실행한다 (Secrets에 OPENAI_API_KEY 필요).
name: checks

on:
  # pull_request 이벤트는 GitHub이 PR 머지 커밋을 만들어야 실행되므로, 브랜치 push 기준으로 실행한다.
  # 체크 결과는 커밋에 붙기 때문에 PR의 필수 체크로도 그대로 인식된다.
  push:
    branches: [ '**' ]
  workflow_dispatch:
    inputs:
      live:
        description: 'OpenAI 실호출 eval(evalTest)도 실행'
        type: boolean
        default: false

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compile
        run: ./gradlew compileJava compileTestJava --no-daemon

      - name: Moderation keyword eval
        run: ./gradlew test --tests '*ModerationKeywordEvalTest' --no-daemon

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-local
          path: build/reports/eval/

  live-eval:
    if: github.event_name == 'workflow_dispatch' && inputs.live
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'corretto'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: OpenAI live eval
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: >
          ./gradlew evalTest --no-daemon
          -Peval.moderation.minRecall=0.85
          -Peval.moderation.maxFalsePositiveRate=0.05
          -Peval.suggestion.minPassRate=0.9
          -Peval.listing.minPassRate=0.75

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-live
          path: build/reports/eval/
