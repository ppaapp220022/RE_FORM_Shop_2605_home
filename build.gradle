plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.6'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com'
version = '0.0.1-SNAPSHOT'
description = 'RE_FORM_Shop_2605'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

ext {
    set('springAiVersion', "2.0.0-M5")
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-batch'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.ai:spring-ai-starter-model-openai'
    implementation 'org.springframework.ai:spring-ai-rag'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.ai:spring-ai-starter-vector-store-pgvector'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'org.mariadb.jdbc:mariadb-java-client'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-batch-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-webmvc-test'
    testImplementation 'org.springframework.security:spring-security-test'
//    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
//    testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client-test'
//    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
//    testImplementation 'org.springframework.boot:spring-boot-starter-webflux-test'
//    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
//    testImplementation 'org.springframework.boot:spring-boot-starter-websocket-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'com.h2database:h2'
    testAnnotationProcessor 'org.projectlombok:lombok'
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.5'
    testImplementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter-test:3.0.5'

    // toss 관련 추가 (민정)
    // https://mvnrepository.com/artifact/com.googlecode.json-simple/json-simple
    implementation group: 'com.googlecode.json-simple', name: 'json-simple', version: '1.1.1'

    // Source: https://mvnrepository.com/artifact/org.modelmapper/modelmapper
    implementation 'org.modelmapper:modelmapper:3.2.5'

    implementation 'io.jsonwebtoken:jjwt-api:0.12.7'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.7'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.7'

    // PGVector 설정
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'org.springframework.ai:spring-ai-starter-vector-store-pgvector'

    // AOP 설정
    implementation 'org.aspectj:aspectjweaver'

}

dependencyManagement {
    imports {
        mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
    }
}

def evalReportDir = layout.buildDirectory.dir('reports/eval').get().asFile.absolutePath

tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'eval'
    }
    systemProperty 'eval.reportDir', evalReportDir
}

// 실제 OpenAI를 호출하는 eval (비용 발생). 예: ./gradlew evalTest -Peval.moderation.minRecall=0.8
tasks.register('evalTest', Test) {
    description = 'Runs LLM evals tagged with @Tag("eval") against real APIs.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'eval'
    }
    outputs.upToDateWhen { false }
    testLogging {
        showStandardStreams = true
    }
    systemProperty 'eval.reportDir', evalReportDir
    def evalProperties = providers.gradlePropertiesPrefixedBy('eval.')
    jvmArgumentProviders.add({ evalProperties.get().collect { key, value -> "-D${key}=${value}".toString() } } as CommandLineArgumentProvider)
}

// 판매글 eval 이미지 생성 (cases.jsonl의 render 스펙 → src/test/resources/eval/listing/images/*.png)
tasks.register('generateListingEvalImages', JavaExec) {
    description = 'Draws labeled uniform images for the listing eval dataset.'
    group = 'verification'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.re_form_shop_2605.eval.listing.ListingEvalImageGenerator'
    args 'src/test/resources/eval/listing/images'
    systemProperty 'java.awt.headless', 'true'
}

// Dockerfile이 소스를 복사하기 전에 의존성만 먼저 받아 레이어로 캐시하도록 bootJar에 필요한 클래스패스를 미리 해석한다
tasks.register('resolveDependencies') {
    description = 'Downloads the dependencies bootJar needs, without compiling sources.'
    group = 'build setup'
    def classpaths = files(
            configurations.compileClasspath,
            configurations.annotationProcessor,
            configurations.runtimeClasspath)
    inputs.files(classpaths)
    doLast {
        logger.lifecycle("Resolved ${classpaths.files.size()} dependency files")
    }
}

jar {
    enabled = false
}

bootJar {
    enabled = true // Executable JAR 생성을 비활성화
}
